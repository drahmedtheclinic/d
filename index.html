    <script>
      // Polyfill/guard window.fetch to provide both getter and setter,
      // preventing "Cannot set property fetch of #<Window> which has only a getter"
      // caused by browser extensions or iframe injector scripts.
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Global safeguard against extension-injected script errors
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            return true;
          }
        });

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            event.reason.message &&
            event.reason.message.indexOf('Cannot set property fetch') !== -1
          ) {
            event.preventDefault();
          }
        });
      })();
    </script>
